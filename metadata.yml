Interpretation: Four ranks of predicted Plasmodium falciparum NF54 inhibition 
  (IC50 below 1 uM and 50% single-point, by lactate dehydrogenase and 
  luminescence) against 50,000 drug-like molecules; 0.65 is better than 99% of 
  them.
